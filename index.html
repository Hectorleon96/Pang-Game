<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="controls">
      <div class="control">
        <span>Start / Pause</span>
        <button type="button" id="play">Pause</button>
      </div>
      <div class="control controls-bubbles-num">
        <span>Number of bubbles</span>
        <select id="num-bubbles">
          <option disabled>Bubbles</option>
          <option value="1">1</option>
          <option value="2" selected>2 (Default)</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
    </div>

    <div id="container" class="container">
      <canvas id="canvas"></canvas>
    </div>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        margin: 0;
        overflow: hidden;
      }

      .container {
        width: 100%;
        height: 100%;
        background-color: #333;
      }

      .controls {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        width: 100%;
        height: 70px;
        padding-inline: 1rem;
        background-color: rgba(0, 0, 0, 0.2);
      }

      .control {
        display: flex;
        flex-direction: column;
        color: #fff;
      }

      canvas {
        display: block;
      }
    </style>

    <script type="module" src="index.js"></script>
  </body>
</html>
